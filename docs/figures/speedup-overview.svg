<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420">
  <rect width="1100" height="420" fill="#ffffff"/>
  <defs>
    <style>
      .axis { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #111111; }
      .legend { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #111111; }
      .grid { stroke: #dddddd; stroke-width: 1; }
      .border { stroke: #111111; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <line class="border" x1="92" y1="44" x2="92" y2="340"/>
  <line class="border" x1="92" y1="340" x2="1040" y2="340"/>
  <text class="axis" x="38" y="214" transform="rotate(-90,38,214)">Speedup over CPU</text>

  <g>
    <line class="grid" x1="92" y1="340" x2="1040" y2="340"/>
    <line class="grid" x1="92" y1="280" x2="1040" y2="280"/>
    <line class="grid" x1="92" y1="220" x2="1040" y2="220"/>
    <line class="grid" x1="92" y1="160" x2="1040" y2="160"/>
    <line class="grid" x1="92" y1="100" x2="1040" y2="100"/>
    <line class="grid" x1="92" y1="40" x2="1040" y2="40"/>
    <g class="axis" text-anchor="end">
      <text x="82" y="344">0</text>
      <text x="82" y="284">4</text>
      <text x="82" y="224">8</text>
      <text x="82" y="164">12</text>
      <text x="82" y="104">16</text>
      <text x="82" y="44">20</text>
    </g>
  </g>

  <g transform="translate(112,16)">
    <rect x="0" y="0" width="12" height="12" fill="#4f77c2"/><text class="legend" x="18" y="11">CPU</text>
    <rect x="64" y="0" width="12" height="12" fill="#e6873a"/><text class="legend" x="82" y="11">GA*</text>
    <rect x="120" y="0" width="12" height="12" fill="#cfcfcf" stroke="#777777"/><text class="legend" x="138" y="11">LockA*</text>
    <rect x="204" y="0" width="12" height="12" fill="#f0c22a"/><text class="legend" x="222" y="11">UBA*</text>
    <rect x="274" y="0" width="12" height="12" fill="#7aa6d9"/><text class="legend" x="292" y="11">BBA*</text>
  </g>

  <!-- group labels -->
  <g class="axis" text-anchor="middle">
    <text x="185" y="376">Empty</text>
    <text x="365" y="376">Random</text>
    <text x="545" y="376">Random rectangle</text>
    <text x="725" y="376">Blocked center</text>
    <text x="905" y="376">Maze</text>
  </g>

  <!-- five groups, five bars each -->
  <!-- Helper: y = 340 - value*15 -->
  <g>
    <rect x="135" y="325" width="20" height="15" fill="#4f77c2"/>
    <rect x="159" y="333" width="20" height="7" fill="#e6873a"/>
    <rect x="183" y="287" width="20" height="53" fill="#cfcfcf" stroke="#777777"/>
    <rect x="207" y="280" width="20" height="60" fill="#f0c22a"/>
    <rect x="231" y="250" width="20" height="90" fill="#7aa6d9"/>

    <rect x="315" y="325" width="20" height="15" fill="#4f77c2"/>
    <rect x="339" y="332" width="20" height="8" fill="#e6873a"/>
    <rect x="363" y="295" width="20" height="45" fill="#cfcfcf" stroke="#777777"/>
    <rect x="387" y="250" width="20" height="90" fill="#f0c22a"/>
    <rect x="411" y="212" width="20" height="128" fill="#7aa6d9"/>

    <rect x="495" y="325" width="20" height="15" fill="#4f77c2"/>
    <rect x="519" y="323" width="20" height="17" fill="#e6873a"/>
    <rect x="543" y="257" width="20" height="83" fill="#cfcfcf" stroke="#777777"/>
    <rect x="567" y="167" width="20" height="173" fill="#f0c22a"/>
    <rect x="591" y="115" width="20" height="225" fill="#7aa6d9"/>

    <rect x="675" y="325" width="20" height="15" fill="#4f77c2"/>
    <rect x="699" y="323" width="20" height="17" fill="#e6873a"/>
    <rect x="723" y="220" width="20" height="120" fill="#cfcfcf" stroke="#777777"/>
    <rect x="747" y="130" width="20" height="210" fill="#f0c22a"/>
    <rect x="771" y="85" width="20" height="255" fill="#7aa6d9"/>

    <rect x="855" y="325" width="20" height="15" fill="#4f77c2"/>
    <rect x="879" y="333" width="20" height="7" fill="#e6873a"/>
    <rect x="903" y="272" width="20" height="68" fill="#cfcfcf" stroke="#777777"/>
    <rect x="927" y="242" width="20" height="98" fill="#f0c22a"/>
    <rect x="951" y="145" width="20" height="195" fill="#7aa6d9"/>
  </g>
</svg>
