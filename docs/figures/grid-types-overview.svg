<svg xmlns="http://www.w3.org/2000/svg" width="760" height="760" viewBox="0 0 760 760">
  <rect width="760" height="760" fill="#ffffff"/>
  <defs>
    <pattern id="noise" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#efefef"/>
      <circle cx="2" cy="3" r="1" fill="#7b7b7b"/>
      <circle cx="7" cy="6" r="1" fill="#aaaaaa"/>
      <circle cx="5" cy="9" r="1" fill="#5f5f5f"/>
    </pattern>
    <pattern id="maze" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#d9d9d9"/>
      <path d="M0 4 H24 M4 0 V24 M12 10 H24 M18 0 V12 M0 18 H18" stroke="#7e7e7e" stroke-width="1.8"/>
    </pattern>
    <radialGradient id="blocked" cx="50%" cy="50%" r="58%">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="42%" stop-color="#6a6a6a"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </radialGradient>
    <style>
      .panel { fill: #ffffff; stroke: #d7d7d7; stroke-width: 2; }
      .path { fill: none; stroke: #ff4d4d; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .pt { fill: #2048ff; }
      .cap { font-family: Georgia, "Times New Roman", serif; font-size: 28px; font-weight: 700; fill: #1f1f1f; }
    </style>
  </defs>

  <g transform="translate(20,20)">
    <rect class="panel" width="330" height="290"/>
    <rect width="330" height="290" fill="url(#noise)"/>
    <circle class="pt" cx="0" cy="0" r="4"/>
    <circle class="pt" cx="330" cy="290" r="4"/>
    <path class="path" d="M5 6 L34 38 L68 62 L98 92 L128 121 L160 156 L195 191 L228 220 L264 246 L298 269 L326 286"/>
    <text class="cap" x="165" y="326" text-anchor="middle">(a) Random obstacles grid</text>
  </g>

  <g transform="translate(410,20)">
    <rect class="panel" width="330" height="290"/>
    <rect width="330" height="290" fill="#ffffff"/>
    <rect x="38" y="148" width="66" height="66" fill="#000000"/>
    <rect x="92" y="54" width="122" height="44" fill="#000000"/>
    <rect x="120" y="96" width="34" height="104" fill="#000000"/>
    <rect x="186" y="72" width="88" height="96" fill="#000000"/>
    <rect x="216" y="184" width="92" height="72" fill="#000000"/>
    <rect x="258" y="20" width="52" height="48" fill="#000000"/>
    <rect x="286" y="212" width="20" height="54" fill="#000000"/>
    <circle class="pt" cx="0" cy="0" r="4"/>
    <circle class="pt" cx="330" cy="290" r="4"/>
    <path class="path" d="M6 4 L62 62 L86 96 L112 132 L142 168 L142 206 L224 206 L296 258 L324 286"/>
    <text class="cap" x="165" y="326" text-anchor="middle">(b) Random rectangle grid</text>
  </g>

  <g transform="translate(20,390)">
    <rect class="panel" width="330" height="290"/>
    <rect width="330" height="290" fill="url(#blocked)"/>
    <circle class="pt" cx="0" cy="0" r="4"/>
    <circle class="pt" cx="330" cy="290" r="4"/>
    <path class="path" d="M2 5 L84 6 L152 6 L208 24 L246 44 L278 82 L296 126 L310 168 L320 212 L327 284"/>
    <text class="cap" x="165" y="326" text-anchor="middle">(c) Blocked center grid</text>
  </g>

  <g transform="translate(410,390)">
    <rect class="panel" width="330" height="290"/>
    <rect width="330" height="290" fill="url(#maze)"/>
    <path d="M10 22 H108 M150 28 H316 M24 74 H182 M208 102 H330 M32 146 H130 M164 170 H282 M40 224 H242 M268 246 H330" stroke="#bdbdbd" stroke-width="5"/>
    <circle class="pt" cx="0" cy="0" r="4"/>
    <circle class="pt" cx="330" cy="290" r="4"/>
    <path class="path" d="M6 8 L14 50 L14 92 L40 116 L104 116 L104 146 L152 146 L152 188 L234 188 L234 256 L320 256"/>
    <text class="cap" x="165" y="326" text-anchor="middle">(d) Maze grid</text>
  </g>
</svg>
