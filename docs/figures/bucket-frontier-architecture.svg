<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320">
  <rect width="900" height="320" fill="#ffffff"/>
  <defs>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 700; fill: #111111; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #111111; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #111111; }
      .grid { fill: #ffffff; stroke: #7f7f7f; stroke-width: 1.2; }
      .activeA { fill: #9bbcf6; }
      .activeB { fill: #f2a15e; }
      .dash { stroke: #8a8a8a; stroke-width: 1.1; stroke-dasharray: 5 4; }
      .blueArrow { stroke: #3a78ff; stroke-width: 2; fill: none; marker-end: url(#blueHead); }
      .orangeArrow { stroke: #f28a2c; stroke-width: 2; fill: none; marker-end: url(#orangeHead); }
    </style>
    <marker id="blueHead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3a78ff"/>
    </marker>
    <marker id="orangeHead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#f28a2c"/>
    </marker>
  </defs>

  <text class="title" x="18" y="40">Open list buckets</text>
  <text class="title" x="18" y="226">Auxiliary buckets</text>

  <g transform="translate(120,18)">
    <line class="dash" x1="0" y1="0" x2="0" y2="110"/>
    <line class="dash" x1="150" y1="0" x2="150" y2="110"/>
    <line class="dash" x1="300" y1="0" x2="300" y2="110"/>
    <line class="dash" x1="450" y1="0" x2="450" y2="110"/>
    <text class="label" x="36" y="18">Bucket 0</text>
    <text class="label" x="186" y="18">Bucket 1</text>
    <text class="label" x="336" y="18">Bucket 2</text>
    <text class="label" x="486" y="18">Bucket 3</text>

    <rect class="grid" x="0" y="36" width="640" height="28"/>
    <rect class="grid activeA" x="0" y="36" width="28" height="28"/>
    <rect class="grid activeA" x="28" y="36" width="28" height="28"/>
    <rect class="grid activeA" x="56" y="36" width="28" height="28"/>
    <rect class="grid activeA" x="150" y="36" width="28" height="28"/>
    <rect class="grid activeA" x="300" y="36" width="28" height="28"/>
    <rect class="grid activeA" x="328" y="36" width="28" height="28"/>
    <rect class="grid activeA" x="450" y="36" width="28" height="28"/>
    <rect class="grid activeB" x="478" y="36" width="28" height="28"/>
    <g fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle">
      <text x="14" y="55">a</text>
      <text x="42" y="55">b</text>
      <text x="70" y="55">c</text>
      <text x="164" y="55">d</text>
      <text x="314" y="55">e</text>
      <text x="342" y="55">f</text>
      <text x="464" y="55">g</text>
      <text x="492" y="55">o</text>
    </g>
  </g>

  <g class="small" text-anchor="middle">
    <text x="170" y="150">0</text>
    <text x="200" y="150">1</text>
    <text x="230" y="150">2</text>
    <text x="260" y="150">3</text>
    <text x="290" y="150">4</text>
    <text x="320" y="150">5</text>
    <text x="350" y="150">6</text>
    <text x="380" y="150">7</text>
    <text x="470" y="150">8</text>
    <text x="500" y="150">9</text>
    <text x="534" y="150">10</text>
    <text x="568" y="150">11</text>
  </g>

  <g>
    <path class="blueArrow" d="M170 82 C170 114, 170 116, 170 138"/>
    <path class="blueArrow" d="M198 82 C198 114, 200 116, 200 138"/>
    <path class="blueArrow" d="M226 82 C226 114, 230 116, 230 138"/>
    <path class="blueArrow" d="M320 82 C320 114, 320 116, 320 138"/>
    <path class="blueArrow" d="M470 82 C470 114, 470 116, 470 138"/>
    <path class="blueArrow" d="M498 82 C498 114, 500 116, 500 138"/>
    <path class="orangeArrow" d="M528 82 C526 138, 360 174, 300 214"/>
    <path class="orangeArrow" d="M554 82 C552 138, 430 174, 394 214"/>
  </g>

  <g transform="translate(170,212)">
    <rect class="grid" x="0" y="0" width="330" height="28"/>
    <rect class="grid activeB" x="84" y="0" width="28" height="28"/>
    <rect class="grid activeB" x="112" y="0" width="28" height="28"/>
    <rect class="grid activeB" x="196" y="0" width="28" height="28"/>
    <rect class="grid activeB" x="224" y="0" width="28" height="28"/>
    <g fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle">
      <text x="98" y="19">k</text>
      <text x="126" y="19">l</text>
      <text x="210" y="19">m</text>
      <text x="238" y="19">n</text>
    </g>
  </g>
</svg>
